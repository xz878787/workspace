<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天龙八部 RAG 助手</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      text-align: center;
      padding: 30px 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #f5af19, #f12711);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      margin-bottom: 20px;
    }
    .message {
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      display: flex;
      justify-content: flex-end;
    }
    .message.user .bubble {
      background: rgba(245, 175, 25, 0.2);
      border: 1px solid rgba(245, 175, 25, 0.3);
      border-radius: 16px 16px 4px 16px;
      max-width: 75%;
      padding: 12px 16px;
      color: #f5af19;
    }
    .message.assistant .bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px 16px 16px 4px;
      max-width: 85%;
      padding: 16px 20px;
      line-height: 1.8;
      word-break: break-word;
    }
    .message.assistant .bubble p { margin-bottom: 8px; }
    .message.assistant .bubble ul, .message.assistant .bubble ol { padding-left: 20px; margin-bottom: 8px; }
    .message.assistant .bubble li { margin-bottom: 4px; }
    .message.assistant .bubble strong { color: #f5af19; }
    .message.assistant .bubble code {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .message.assistant .bubble pre {
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .message.assistant .bubble h1, .message.assistant .bubble h2, .message.assistant .bubble h3 {
      color: #f5af19;
      margin: 12px 0 8px;
    }
    .sources {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sources details summary {
      cursor: pointer;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }
    .source-item {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .input-area {
      position: sticky;
      bottom: 0;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
    }
    .input-wrapper input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    .input-wrapper input:focus {
      border-color: rgba(245, 175, 25, 0.5);
    }
    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    .input-wrapper button {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f5af19, #f12711);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    .input-wrapper button:hover {
      opacity: 0.9;
    }
    .input-wrapper button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }
    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: bounce 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }
    .hint {
      text-align: center;
      color: rgba(255, 255, 255, 0.2);
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>天龙八部 RAG 助手</h1>
      <p>基于 AI 的智能小说问答系统 · 向量检索 + LLM 生成</p>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="message assistant">
        <div class="bubble">
          你好！我是《天龙八部》小说助手，你可以问我任何关于小说的问题。比如：<br><br>
          • 虚竹会什么武功？<br>
          • 乔峰的身世是什么？<br>
          • 段誉和王语嫣的故事<br>
          • 扫地僧是谁？<br>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <input
          type="text"
          id="questionInput"
          placeholder="输入你的问题，按 Enter 发送..."
          autofocus
        />
        <button id="sendBtn">发送</button>
      </div>
      <div class="hint">按 Enter 发送 · Powered by Milvus + Qwen</div>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea')
    const input = document.getElementById('questionInput')
    const sendBtn = document.getElementById('sendBtn')

    let loading = false

    function addMessage(role, text, sources) {
      const div = document.createElement('div')
      div.className = `message ${role}`

      let bubbleHTML
      if (role === 'assistant') {
        bubbleHTML = marked.parse(text)
      } else {
        bubbleHTML = text.replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      let html = `<div class="bubble">${bubbleHTML}</div>`

      if (sources && sources.length > 0) {
        html += '<div class="sources"><details><summary>查看检索来源</summary>'
        sources.forEach((s, i) => {
          html += `<div class="source-item">
<strong>[第${s.chapter}章]</strong> 相似度: ${s.score}
${s.content}
</div>`
        })
        html += '</details></div>'
      }

      div.innerHTML = html
      return div
    }

    function addTyping() {
      const div = document.createElement('div')
      div.className = 'message assistant typing-indicator'
      div.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>'
      chatArea.appendChild(div)
      chatArea.scrollTop = chatArea.scrollHeight
    }

    function removeTyping() {
      const indicator = document.querySelector('.typing-indicator')
      if (indicator) indicator.remove()
    }

    async function sendQuestion() {
      const question = input.value.trim()
      if (!question || loading) return

      loading = true
      input.value = ''
      sendBtn.disabled = true

      chatArea.appendChild(addMessage('user', question))
      chatArea.scrollTop = chatArea.scrollHeight

      addTyping()

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        })
        const data = await res.json()

        removeTyping()
        chatArea.appendChild(addMessage('assistant', data.answer || data.error, data.sources))
      } catch (e) {
        removeTyping()
        chatArea.appendChild(addMessage('assistant', '网络错误，请检查服务器是否运行。'))
      }

      chatArea.scrollTop = chatArea.scrollHeight
      loading = false
      sendBtn.disabled = false
      input.focus()
    }

    sendBtn.addEventListener('click', sendQuestion)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendQuestion()
    })
  </script>
</body>
</html>
