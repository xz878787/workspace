<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3列布局 - float 双飞翼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font: 16px/1.6 system-ui, sans-serif; }

    /* float:left 开启一个新的 BFC，脱离普通文档流 */
    .layout {
      height: 100%;
      overflow: hidden; /* 父级也开启 BFC，清除内部浮动造成的高度塌陷 */
    }
    /* main 最先加载：中间列先浮动占满整行，两侧用负 margin 拉回 */
    .content {
      float: left;
      width: 100%;
      height: 100%;
      background: #eee;
    }
    .content-inner {
      margin: 0 300px 0 200px; /* 双飞翼：给左右浮动列让出空间 */
      padding: 16px;
    }
    .left {
      float: left;
      width: 200px;
      height: 100%;
      margin-left: -100%;   /* 向左拉满一整行，回到最左侧 */
      background: #cf5e5e;
      padding: 16px;
    }
    .right {
      float: left;
      width: 300px;
      height: 100%;
      margin-left: -300px;  /* 向左拉回自身宽度，贴到右边界 */
      background: #5e9acf;
      padding: 16px;
    }
  </style>
</head>
<body>
  <!-- main 在 DOM 中最先加载，中间先渲染 -->
  <div class="layout">
    <main class="content">
      <div class="content-inner">Main 中间自适应</div>
    </main>
    <aside class="left">Left 200px</aside>
    <aside class="right">Right 300px</aside>
  </div>
</body>
</html>
